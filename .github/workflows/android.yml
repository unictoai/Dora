name: Dora Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Dora and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint, and assemble release
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Verify ARM64 native library is packaged
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libdora_native.so'

      - name: Create ephemeral pre-alpha signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/dora-prealpha.keystore" \
            -storepass android -keypass android \
            -alias dora-prealpha -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Dora Pre-alpha, OU=Testing, O=Unicto, C=US"

      - name: Sign and verify release APK
        run: |
          apksigner sign \
            --ks "$RUNNER_TEMP/dora-prealpha.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias dora-prealpha \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release-signed.apk

      - name: Verify Room schema fixture is committed
        run: |
          test -s app/schemas/app.dora.localai.data.DoraDatabase/6.json
          git diff --exit-code -- app/schemas/app.dora.localai.data.DoraDatabase/6.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dora-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dora-release-arm64
          path: app/build/outputs/apk/release/app-release-signed.apk
